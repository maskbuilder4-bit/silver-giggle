<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnSmart - Login to Your Account</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-indigo: #1E1B4B;
            --emerald-green: #10B981;
            --coral-orange: #FF6B6B;
            --light-bg: #F8FAFC;
            --text-dark: #0F172A;
            --text-muted: #64748B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-indigo) 0%, #312E81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            animation: float 8s ease-in-out infinite alternate;
        }
        .circle-1 {
            width: 320px;
            height: 320px;
            background: rgba(16, 185, 129, 0.22);
            top: 15%;
            right: 15%;
        }
        .circle-2 {
            width: 300px;
            height: 300px;
            background: rgba(255, 107, 107, 0.18);
            bottom: 15%;
            left: 15%;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(30px) rotate(10deg); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            background: #FFFFFF;
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-indigo);
            margin-bottom: 5px;
        }
        .brand-logo span {
            color: var(--emerald-green);
        }

        .tagline {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s ease;
            background: var(--light-bg);
        }

        .input-wrapper input:focus {
            border-color: var(--emerald-green);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .input-wrapper input:focus + i {
            color: var(--emerald-green);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--emerald-green) 0%, #059669 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .form-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-footer a {
            color: var(--primary-indigo);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .form-footer a:hover {
            color: var(--coral-orange);
        }
    </style>
</head>
<body>

    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div class="login-container">

        <div class="brand-logo"><i class="fa-solid fa-wallet"></i> Earn<span>Smart</span></div>
        <p class="tagline">Wapas Aane Ke Liye Shukriya! Apne Account Me Log In Karein.</p>

        <form onsubmit="handleLogin(event)">

            <div class="input-group">
                <label for="loginInput">Email Ya Mobile Number</label>
                <div class="input-wrapper">
                    <input type="text" id="loginInput" placeholder="Registered Email ya Mobile Number dalein" required>
                    <i class="fa-regular fa-user"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Log In Karein <i class="fa-solid fa-right-to-bracket"></i>
            </button>

        </form>

        <div class="form-footer">
            Naye User Hain? <a href="index.html">Pehle Sign-Up Karein</a>
        </div>

    </div>

    <script src="auth.js"></script>

</body>
</html>

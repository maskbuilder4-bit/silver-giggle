<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnSmart - Join & Start Earning</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #090D16;
            --surface: #131D31;
            --accent-glow: #6366F1;
            --emerald: #10B981;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
        }

        .signup-container {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .brand-logo span { color: var(--accent-glow); }

        .tagline {
            text-align: center;
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 13px 16px 13px 46px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            background: rgba(9, 13, 22, 0.5);
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-glow);
            background: rgba(9, 13, 22, 0.8);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }
        .input-wrapper input:focus + i { color: var(--accent-glow); }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-glow) 0%, #4F46E5 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.5);
        }

        .form-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
            color: var(--text-muted);
        }
        .form-footer a {
            color: var(--accent-glow);
            text-decoration: none;
            font-weight: 600;
        }
        .form-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="brand-logo">Earn<span>Smart</span></div>
        <p class="tagline">Create an account & start your earning journey</p>

        <form onsubmit="handleSignup(event)">
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullname" placeholder="Rahul Sharma" required>
                    <i class="fa-regular fa-user"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="name@example.com" required>
                    <i class="fa-regular fa-envelope"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="schoolNickname">School Nickname</label>
                <div class="input-wrapper">
                    <input type="text" id="schoolNickname" placeholder="e.g., Chemistry Geek" required>
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="interests">Interested Things</label>
                <div class="input-wrapper">
                    <input type="text" id="interests" placeholder="e.g., Glitter covers, aesthetic stickers" required>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Create Account <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="form-footer">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

<script src="auth.js"></script>
</body>
</html>

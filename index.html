<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnSmart - Join & Start Earning</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-indigo: #1E1B4B;
            --emerald-green: #10B981;
            --coral-orange: #FF6B6B;
            --light-bg: #F8FAFC;
            --text-dark: #0F172A;
            --text-muted: #64748B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-indigo) 0%, #312E81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            animation: float 8s ease-in-out infinite alternate;
        }
        .circle-1 {
            width: 300px;
            height: 300px;
            background: rgba(16, 185, 129, 0.25);
            top: 10%;
            left: 10%;
        }
        .circle-2 {
            width: 350px;
            height: 350px;
            background: rgba(255, 107, 107, 0.2);
            bottom: 10%;
            right: 10%;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(30px) rotate(10deg); }
        }

        .signup-container {
            position: relative;
            z-index: 10;
            background: #FFFFFF;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-indigo);
            margin-bottom: 5px;
        }
        .brand-logo span {
            color: var(--emerald-green);
        }

        .tagline {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .disclaimer-box {
            background-color: rgba(255, 107, 107, 0.08);
            border-left: 4px solid var(--coral-orange);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .disclaimer-box i {
            color: var(--coral-orange);
            font-size: 16px;
            margin-top: 2px;
        }
        .disclaimer-box p {
            font-size: 12px;
            color: #991B1B;
            line-height: 1.5;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s ease;
            background: var(--light-bg);
        }

        .input-wrapper input:focus {
            border-color: var(--emerald-green);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .optional-badge {
            font-size: 10px;
            background: #E2E8F0;
            color: var(--text-muted);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--emerald-green) 0%, #059669 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-footer a {
            color: var(--primary-indigo);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div class="signup-container">

        <div class="brand-logo"><i class="fa-solid fa-wallet"></i> Earn<span>Smart</span></div>
        <p class="tagline">Refer kijiye aur apni part-time pocket money banaiye!</p>

        <div class="disclaimer-box">
            <i class="fa-solid fa-circle-info"></i>
            <p><strong>Dhyan Dein:</strong> Yeh platform sirf side-income aur part-time earning ke liye hai.</p>
        </div>

        <form onsubmit="handleSignup(event)">
    <div class="input-group">
        <label for="fullname">Full Name</label>
        <div class="input-wrapper">
            <input type="text" id="fullname" placeholder="Rahul Sharma" required>
            <i class="fa-regular fa-user"></i>
        </div>
    </div>

    <div class="input-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
            <input type="email" id="email" placeholder="name@example.com" required>
            <i class="fa-regular fa-envelope"></i>
        </div>
    </div>

    <div class="input-group">
        <label for="schoolNickname">School Nickname</label>
        <div class="input-wrapper">
            <input type="text" id="schoolNickname" placeholder="e.g., Chemistry Geek" required>
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
    </div>

    <div class="input-group">
        <label for="interests">Interested Things</label>
        <div class="input-wrapper">
            <input type="text" id="interests" placeholder="e.g., Glitter covers, aesthetic stickers" required>
            <i class="fa-solid fa-heart"></i>
        </div>
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required>
            <i class="fa-solid fa-lock"></i>
        </div>
    </div>

    <button type="submit" class="btn-submit">
        Create Account <i class="fa-solid fa-arrow-right"></i>
    </button>
</form>

        <div class="form-footer">
            Pehle se account hai? <a href="login.html">Log In karein</a>
        </div>

    </div>

<script src="auth.js"></script>

</body>
</html>

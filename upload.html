<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnSmart - Bioluminescent Jellyfish Matrix Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --abyss-deep: #020611;
            --jelly-core: rgba(11, 20, 38, 0.45);
            --jelly-border: rgba(45, 212, 191, 0.25);
            --neon-teal: #2DD4BF;
            --neon-aqua: #38BDF8;
            --neon-violet: #A78BFA;
            --neon-coral: #FB7185;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--abyss-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(45, 212, 191, 0.18), transparent 50%),
                radial-gradient(circle at 10% 110%, rgba(167, 139, 250, 0.15), transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(56, 189, 248, 0.12), transparent 40%);
        }

        /* Fluid Swimming Jellyfish Bioluminescent Orbs */
        .jelly-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.65;
            animation: swimJelly 12s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 420px;
            height: 420px;
            background: rgba(45, 212, 191, 0.18);
            top: -5%;
            left: 10%;
        }

        .blob-2 {
            width: 480px;
            height: 480px;
            background: rgba(167, 139, 250, 0.16);
            bottom: -10%;
            right: 8%;
            animation-delay: -4s;
            animation-duration: 15s;
        }

        .blob-3 {
            width: 320px;
            height: 320px;
            background: rgba(56, 189, 248, 0.14);
            top: 40%;
            right: 20%;
            animation-delay: -7s;
            animation-duration: 10s;
        }

        @keyframes swimJelly {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.45; }
            50% { transform: translateY(-40px) scale(1.18) rotate(15deg); opacity: 0.75; }
            100% { transform: translateY(35px) scale(0.88) rotate(-12deg); opacity: 0.55; }
        }

        /* Jellyfish Glass Floating Container */
        .upload-container {
            position: relative;
            z-index: 10;
            background: var(--jelly-core);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--jelly-border);
            width: 100%;
            max-width: 480px;
            border-radius: 36px;
            padding: 44px 34px;
            box-shadow: 
                0 35px 75px rgba(2, 6, 17, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                inset 0 0 35px rgba(45, 212, 191, 0.08);
            animation: floatContainer 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: box-shadow 0.5s ease, border-color 0.5s ease;
        }

        .upload-container:hover {
            border-color: rgba(45, 212, 191, 0.45);
            box-shadow: 
                0 40px 90px rgba(2, 6, 17, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 0 45px rgba(45, 212, 191, 0.14);
        }

        @keyframes floatContainer {
            from { opacity: 0; transform: translateY(35px) scale(0.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .brand-logo span {
            background: linear-gradient(135deg, var(--neon-teal), var(--neon-aqua), var(--neon-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(45, 212, 191, 0.6));
        }

        .tagline {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
            letter-spacing: 0.4px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            transition: color 0.3s ease;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-wrapper textarea ~ i {
            top: 18px;
            transform: none;
        }

        .input-wrapper input,
        .input-wrapper textarea {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            background: rgba(2, 6, 17, 0.55);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-wrapper textarea {
            resize: vertical;
            min-height: 90px;
        }

        .input-wrapper input:focus,
        .input-wrapper textarea:focus {
            border-color: var(--neon-teal);
            background: rgba(2, 6, 17, 0.85);
            box-shadow: 0 0 30px rgba(45, 212, 191, 0.25), inset 0 0 12px rgba(45, 212, 191, 0.1);
        }

        .input-wrapper input:focus + i,
        .input-wrapper textarea:focus + i {
            color: var(--neon-teal);
            transform: translateY(-50%) scale(1.1);
            text-shadow: 0 0 12px var(--neon-teal);
        }

        .input-wrapper textarea:focus ~ i {
            transform: none;
            color: var(--neon-teal);
            text-shadow: 0 0 12px var(--neon-teal);
        }

        .input-group:focus-within label {
            color: var(--neon-teal);
        }

        /* Bioluminescent Jellyfish File Box with Ripple Glow */
        .file-upload-box {
            border: 2px dashed rgba(56, 189, 248, 0.28);
            padding: 22px;
            border-radius: 16px;
            text-align: center;
            background: rgba(2, 6, 17, 0.5);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .file-upload-box::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(45, 212, 191, 0.15), transparent);
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .file-upload-box:hover::before {
            left: 100%;
        }

        .file-upload-box:hover {
            border-color: var(--neon-teal);
            background: rgba(45, 212, 191, 0.07);
            box-shadow: 0 0 35px rgba(45, 212, 191, 0.25);
            transform: translateY(-2px);
        }

        .file-upload-box input[type="file"] {
            display: none;
        }

        .file-upload-label {
            font-size: 13.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .file-upload-label i {
            color: var(--neon-violet);
            font-size: 18px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease;
        }

        .file-upload-box:hover .file-upload-label i {
            transform: translateY(-5px) scale(1.15) rotate(8deg);
            color: var(--neon-teal);
            text-shadow: 0 0 15px var(--neon-teal);
        }

        /* Shimmering Multi-Spectrum Jellyfish Button */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--neon-teal) 0%, var(--neon-aqua) 50%, var(--neon-violet) 100%);
            color: #020611;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 12px 35px rgba(45, 212, 191, 0.4);
            margin-top: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 65%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .btn-submit:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 18px 45px rgba(167, 139, 250, 0.6);
            filter: brightness(1.12);
        }

        .btn-submit:hover::after {
            opacity: 1;
        }

        .form-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
        }

        .form-footer a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .form-footer a:hover {
            color: var(--neon-teal);
            text-shadow: 0 0 10px rgba(45, 212, 191, 0.6);
        }
    </style>
</head>
<body>

    <!-- Bioluminescent Jellyfish Floating Orbs -->
    <div class="jelly-blob blob-1"></div>
    <div class="jelly-blob blob-2"></div>
    <div class="jelly-blob blob-3"></div>

    <div class="upload-container">
        <div class="brand-logo">Earn<span>Smart</span></div>
        <p class="tagline">Deep-Sea Bioluminescent Node Matrix</p>

        <form onsubmit="handleProductUpload(event)">
            <div class="input-group">
                <label for="prodTitle">Product Title</label>
                <div class="input-wrapper">
                    <input type="text" id="prodTitle" placeholder="e.g., Phantom Crystal Notebook" required>
                    <i class="fa-solid fa-book"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="prodDesc">Description</label>
                <div class="input-wrapper">
                    <textarea id="prodDesc" placeholder="Highlight your glowing design features..." required></textarea>
                    <i class="fa-solid fa-align-left"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="prodWhatsapp">WhatsApp Number</label>
                <div class="input-wrapper">
                    <input type="tel" id="prodWhatsapp" placeholder="919876543210 (With country code)" pattern="[0-9]{10,12}" required>
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
            </div>

            <div class="input-group">
                <label>Product Image Asset</label>
                <div class="file-upload-box" onclick="document.getElementById('prodImage').click()">
                    <input type="file" id="prodImage" accept="image/*" required onchange="previewFileName(this)">
                    <div class="file-upload-label" id="fileLabelText">
                        <i class="fa-solid fa-cloud-arrow-up"></i><span>Pulse to Sync Image File</span>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Initialize Matrix <i class="fa-solid fa-upload"></i>
            </button>
        </form>

        <div class="form-footer">
            <a href="home.html"><i class="fa-solid fa-arrow-left"></i> Return to Marketplace</a>
        </div>
    </div>
     <script>marker.js</script>
    <!-- Core Integration Scripts -->
    <script src="auth.js"></script>
    <script>
        function previewFileName(input) {
            const labelText = document.getElementById('fileLabelText');
            if (input.files && input.files[0]) {
                labelText.innerHTML = `<i class="fa-solid fa-check" style="color: var(--neon-teal); text-shadow: 0 0 12px var(--neon-teal);"></i> <span style="color: var(--text-main); font-weight: 600;">${input.files[0].name}</span>`;
            }
        }

        async function handleProductUpload(event) {
            event.preventDefault();

            const title = document.getElementById('prodTitle').value.trim();
            const description = document.getElementById('prodDesc').value.trim();
            const whatsapp = document.getElementById('prodWhatsapp').value.trim();
            const imageInput = document.getElementById('prodImage');

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const newProduct = {
                        id: Date.now(),
                        title,
                        description,
                        whatsapp,
                        image: e.target.result,
                        synced: false
                    };

                    let products = JSON.parse(localStorage.getItem('products') || '[]');
                    products.push(newProduct);
                    localStorage.setItem('products', JSON.stringify(products));

                    try {
                        const response = await fetch(`${BACKEND_URL}/api/upload-product`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(newProduct)
                        });
                        if(response.ok) {
                            newProduct.synced = true;
                            localStorage.setItem('products', JSON.stringify(products));
                        }
                    } catch (err) {
                        console.log("Offline mode: Product stored locally.");
                    }

                    alert("Product successfully uploaded and listed!");
                    window.location.href = "home.html";
                };
                reader.readAsDataURL(imageInput.files[0]);
            }
        }
    </script>
    <script>upload.js</script>
</body>
</html>

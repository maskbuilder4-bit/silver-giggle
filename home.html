<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Giggle - Student Profile & Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --void: #050608;
            --void-2: #0A0D14;
            --panel: rgba(14, 18, 28, 0.62);
            --panel-border: rgba(200, 212, 220, 0.14);
            --chrome-1: #E7EDF2;
            --chrome-2: #9AA8B5;
            --chrome-3: #4C5866;
            --cyan: #45E8D4;
            --violet: #8B7FFF;
            --flash: #F5FAFF;
            --text-main: #F1F4F7;
            --text-muted: #8A94A3;
            --coral: #FB7185;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--void);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== STORM WALLPAPER BACKGROUND ===== */
        #stormSky {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 45% at 20% 0%, rgba(139,127,255,0.16) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 85% 10%, rgba(69,232,212,0.12) 0%, transparent 60%),
                linear-gradient(180deg, #060810 0%, #090C15 45%, #050608 100%);
        }
        .cloud-layer {
            position: fixed;
            inset: -10%;
            z-index: 0;
            background-image:
                radial-gradient(ellipse 45% 18% at 12% 18%, rgba(154,168,181,0.10), transparent 70%),
                radial-gradient(ellipse 55% 22% at 78% 8%, rgba(154,168,181,0.08), transparent 70%),
                radial-gradient(ellipse 40% 16% at 55% 30%, rgba(154,168,181,0.07), transparent 70%);
            animation: driftClouds 40s ease-in-out infinite alternate;
            filter: blur(2px);
        }
        @keyframes driftClouds {
            0% { transform: translateX(-2%) translateY(0); }
            100% { transform: translateX(2%) translateY(1.5%); }
        }
        .skyline {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 26vh;
            z-index: 1;
            pointer-events: none;
            background:
                linear-gradient(180deg, transparent 0%, rgba(5,6,8,0.9) 90%),
                repeating-linear-gradient(90deg, #0B0E16 0 38px, #0D111A 38px 40px);
            clip-path: polygon(0% 100%,0% 55%,4% 55%,4% 40%,9% 40%,9% 62%,14% 62%,14% 30%,20% 30%,20% 50%,26% 50%,26% 20%,31% 20%,31% 58%,37% 58%,37% 44%,43% 44%,43% 26%,49% 26%,49% 60%,55% 60%,55% 36%,61% 36%,61% 18%,67% 18%,67% 52%,73% 52%,73% 32%,79% 32%,79% 46%,85% 46%,85% 24%,91% 24%,91% 56%,96% 56%,96% 42%,100% 42%,100% 100%);
            opacity: 0.85;
        }

        /* ===== NAV ===== */
        nav {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 5%;
            background: rgba(5,6,8,0.55);
            backdrop-filter: blur(22px) saturate(140%);
            border-bottom: 1px solid var(--panel-border);
        }
        .logo {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 10px;
        }
        .logo .bolt { color: var(--cyan); text-shadow: 0 0 18px rgba(69,232,212,0.7); }
        .logo span {
            background: linear-gradient(135deg, var(--chrome-1), var(--chrome-3) 60%, var(--chrome-1));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .nav-links { display: flex; align-items: center; gap: 8px; }
        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px; font-weight: 600;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid transparent;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.25s ease;
        }
        .nav-links a:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.04);
            border-color: var(--panel-border);
        }
        .nav-links a.active {
            color: var(--void);
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            box-shadow: 0 4px 18px rgba(69,232,212,0.25);
        }
        .nav-links a.logout-btn {
            color: var(--coral);
            border-color: rgba(251, 113, 133, 0.25);
            background: rgba(251, 113, 133, 0.08);
        }
        .nav-links a.logout-btn:hover {
            background: rgba(251, 113, 133, 0.2);
            color: var(--text-main);
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 5%; position: relative; z-index: 10; }

        /* ===== PROFILE HEADER ===== */
        .profile-header-card {
            background: var(--panel);
            backdrop-filter: blur(25px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .profile-user-info { display: flex; align-items: center; gap: 24px; }
        .avatar-circle {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: 34px;
            font-weight: 700;
            color: var(--void);
            box-shadow: 0 0 25px rgba(69,232,212,0.4);
        }

        .user-details h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 26px; font-weight: 700; margin-bottom: 4px; color: var(--text-main);
        }
        .user-details p { color: var(--text-muted); font-size: 14px; margin-bottom: 10px; }
        
        .badge-school {
            background: rgba(139, 127, 255, 0.1);
            color: var(--violet);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 600;
            border: 1px solid rgba(139, 127, 255, 0.25);
            display: inline-block;
        }

        .stats-boxes { display: flex; gap: 16px; flex-wrap: wrap; }
        .stat-box {
            background: rgba(5, 6, 8, 0.6);
            border: 1px solid var(--panel-border);
            padding: 16px 26px;
            border-radius: 18px;
            text-align: center;
            min-width: 150px;
        }
        .stat-box span { display: block; font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; letter-spacing: 1px; }
        .stat-box h3 { font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; color: var(--cyan); }

        .section-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 24px; font-weight: 700; margin-bottom: 22px;
            display: flex; align-items: center; gap: 10px;
        }

        /* ===== USER'S PRODUCTS GRID ===== */
        .my-products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 26px;
            margin-bottom: 80px;
        }
        @media (max-width: 1024px) {
            .my-products-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            .my-products-grid { grid-template-columns: 1fr; }
            .profile-header-card { flex-direction: column; align-items: flex-start; }
        }

        .product-mini-card {
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .product-mini-card:hover {
            border-color: rgba(69,232,212,0.4);
            transform: translateY(-4px);
        }
        .product-mini-card img {
            width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 14px; background: var(--void-2);
        }
        .product-mini-card h4 { font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 600; margin-bottom: 6px; }
        .product-mini-card p { font-size: 13.5px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }

        .btn-delete {
            background: rgba(251, 113, 133, 0.1);
            color: var(--coral);
            border: 1px solid rgba(251, 113, 133, 0.25);
            padding: 10px;
            border-radius: 12px;
            font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-delete:hover {
            background: rgba(251, 113, 133, 0.25);
            color: var(--text-main);
        }

        .empty-profile {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--panel);
            border-radius: 20px;
            border: 1px dashed var(--panel-border);
            color: var(--text-muted);
        }
        .empty-profile i { font-size: 40px; color: var(--cyan); margin-bottom: 12px; display: block; }

        footer {
            position: relative; z-index: 10;
            border-top: 1px solid var(--panel-border);
            padding: 34px 5% 46px;
            text-align: center;
            color: var(--text-muted); font-size: 13px;
        }
        footer .fbolt { color: var(--cyan); }
    </style>
</head>
<body onload="loadProfileData()">

    <div id="stormSky"></div>
    <div class="cloud-layer"></div>
    <div class="skyline"></div>

    <nav>
        <div class="logo"><i class="fa-solid fa-bolt bolt"></i><span>Silver Giggle</span></div>
        <div class="nav-links">
            <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
            <a href="upload.html"><i class="fa-solid fa-plus-circle"></i> Sell Your Work</a>
            <a href="profile.html" class="active"><i class="fa-solid fa-id-card-clip"></i> My Profile</a>
            <a href="#" onclick="handleLogout()" class="logout-btn"><i class="fa-solid fa-power-off"></i> Logout</a>
        </div>
    </nav>

    <div class="container">
        <!-- Profile Account Info & Upload Count Header -->
        <div class="profile-header-card">
            <div class="profile-user-info">
                <div class="avatar-circle" id="avatarInitial">U</div>
                <div class="user-details">
                    <h1 id="userNameDisplay">Student Name</h1>
                    <p id="userEmailDisplay">student@campus.edu</p>
                    <div class="badge-school" id="userSchoolTag"><i class="fa-solid fa-graduation-cap"></i> Campus Creator</div>
                </div>
            </div>
            <div class="stats-boxes">
                <div class="stat-box">
                    <span>Total Uploads</span>
                    <h3 id="totalUploadsCount">0</h3>
                </div>
            </div>
        </div>

        <h2 class="section-title"><i class="fa-solid fa-box-archive" style="color: var(--cyan);"></i> My Campus Listings & Projects</h2>
        <div class="my-products-grid" id="myProductsContainer">
            <!-- User products loaded dynamically -->
        </div>
    </div>

    <footer>
        <span class="fbolt"><i class="fa-solid fa-bolt"></i></span> Silver Giggle — built by students, for students.
    </footer>

    <script src="auth.js"></script>
    <script>
        function loadProfileData() {
            const currentUserData = localStorage.getItem('currentUser');
            if (!currentUserData) {
                alert("Please log in first to access your profile!");
                window.location.href = "login.html";
                return;
            }

            const currentUser = JSON.parse(currentUserData);
            document.getElementById('userNameDisplay').innerText = currentUser.fullname || "Student Creator";
            document.getElementById('userEmailDisplay').innerText = currentUser.email || "No email provided";
            document.getElementById('avatarInitial').innerText = (currentUser.fullname || "S").charAt(0).toUpperCase();
            
            if(currentUser.schoolNickname) {
                document.getElementById('userSchoolTag').innerHTML = `<i class="fa-solid fa-school"></i> Campus / Nickname: ${currentUser.schoolNickname}`;
            }

            const products = JSON.parse(localStorage.getItem('products') || '[]');
            const container = document.getElementById('myProductsContainer');
            container.innerHTML = '';

            document.getElementById('totalUploadsCount').innerText = products.length;

            if(products.length === 0) {
                container.innerHTML = `
                    <div class="empty-profile">
                        <i class="fa-solid fa-folder-open"></i>
                        <p>You haven't uploaded any decorated notebooks or notes yet!</p>
                    </div>`;
                return;
            }

            products.forEach((prod) => {
                container.innerHTML += `
                    <div class="product-mini-card">
                        <div>
                            ${prod.image ? `<img src="${prod.image}" alt="${prod.title}">` : ''}
                            <h4>${prod.title}</h4>
                            <p>${prod.description}</p>
                        </div>
                        <button class="btn-delete" onclick="deleteProduct(${prod.id})"><i class="fa-solid fa-trash"></i> Remove Item</button>
                    </div>
                `;
            });
        }

        function deleteProduct(productId) {
            if(confirm("Are you sure you want to remove this project listing?")) {
                let products = JSON.parse(localStorage.getItem('products') || '[]');
                products = products.filter(p => p.id !== productId);
                localStorage.setItem('products', JSON.stringify(products));
                loadProfileData();
            }
        }
    </script>
</body>
</html>
